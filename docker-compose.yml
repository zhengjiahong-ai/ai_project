services:
  # --- 前端 React 服务 ---
  frontend:
    build: ./frontend
    container_name: paper_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app         # 核心：将本地代码映射进容器，实现热更新
      - /app/node_modules       # 防止本地 node_modules 覆盖容器内的
    environment:
      - VITE_API_BASE_URL=http://localhost:8081/api # 指向 Java 后端
    depends_on:
      - backend

  # --- Java 后端服务 ---
  backend:
    build: ./backend-java
    container_name: backend_java
    ports:
      - "8081:8080"
    volumes:
      - java_data:/app/data # 🔥 修复：挂载 H2 数据库目录防止数据丢失
    # 如果 Java 需要调用 Python，确保它知道 ai-service 这个主机名
    environment:
      # 🚀 这里告诉 Java：去请求名为 ai-service 的容器
      - SPRING_PROFILES_ACTIVE=dev
      - PYTHON_URL=http://ai-service:8000/api
    depends_on:
      - ai-service

  # --- Python AI 服务 ---
  ai-service:
    build: ./ai-service-python
    container_name: ai_service_python
    restart: always  # 🔥 重要：挂了自动重启，直到 Grobid 准备好
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service-python:/app      # 映射本地代码，容器重启后使用当前工作区内容；Dockerfile 默认不启用 uvicorn --reload
      - chroma_data:/app/chroma_data  # 🔥 修复：挂载向量数据库防止重启后 RAG 失忆
      - research_task_data:/app/data  # 持久化深度研究任务快照
      - huggingface_cache:/root/.cache/huggingface # 挂载 HF 缓存防止每次重启重新下载 1.3GB 模型
    env_file:
      - .env  # 加载根目录的 .env 文件
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_TRANSLATION_MODEL=${DEEPSEEK_TRANSLATION_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_THINKING_TYPE=${DEEPSEEK_THINKING_TYPE:-enabled}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-high}
      - PYTHON_SERVICE_URL=http://ai-service:8000/api
      - CHROMA_DB_PATH=/app/chroma_data
      # HF Hub 当前被 TLS 干扰而不可达（SSL: WRONG_VERSION_NUMBER），而 huggingface_hub 的
      # 重试次数与退避是硬编码的：每个模型文件重试 5 轮（1+2+4+8+8s），6 个文件让 warmup
      # 卡 6~10 分钟才开始监听端口，Java 网关的健康检查必然超时。
      # 嵌入模型已缓存在 huggingface_cache 卷里，离线加载实测秒级完成，故默认离线。
      # 需要下载新模型时，在 .env 里设 PIXIU_HF_OFFLINE=0 后重建容器即可。
      - HF_HUB_OFFLINE=${PIXIU_HF_OFFLINE:-1}
      # 中文提问检索英文论文时，查询会先被译成英文再检索（见 core/query_rewriter.py）：
      # 多语言小模型在纯英文语料上处理中文查询会系统性坍缩到同一篇论文，实测 10 个
      # 中文查询有 7 个 top-1 落在同一篇仅占库 15% chunk 的论文上，译成英文后 4/4 修正。
      # 翻译 LLM 不可用或译文质量出问题时，设 PIXIU_QUERY_REWRITE_ENABLED=0 退回改写前行为；
      # benchmarks/retrieval_quality 也靠这个开关做 A/B。
      - PIXIU_QUERY_REWRITE_ENABLED=${PIXIU_QUERY_REWRITE_ENABLED:-1}
      - RESEARCH_TASK_DB_PATH=/app/data/research_tasks.sqlite3
      - NEO4J_URI=${NEO4J_URI:-}
      - NEO4J_USER=${NEO4J_USER:-}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
    depends_on:
      - grobid

  # --- GROBID 服务（用于PDF解析） ---
  neo4j:
    profiles:
      - neo4j
    image: neo4j:5-community
    container_name: pixiu_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/pixiu_neo4j_password}
    volumes:
      - neo4j_data:/data

  grobid:
    image: lfoppiano/grobid:0.7.2
    container_name: grobid_service
    restart: unless-stopped
    ports:
      - "8070:8070"
    environment:
      - JAVA_OPTS=-Xmx2g -Xms512m
    volumes:
      - grobid_data:/opt/grobid/home
    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  grobid_data:
  java_data:
  chroma_data:
  research_task_data:
  huggingface_cache:
  neo4j_data:
