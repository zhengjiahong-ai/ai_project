services:
  # --- 前端 React 服务 ---
  frontend:
    build: ./frontend
    container_name: paper_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app         # 核心：将本地代码映射进容器，实现热更新
      - /app/node_modules       # 防止本地 node_modules 覆盖容器内的
    environment:
      - VITE_API_BASE_URL=http://localhost:8080 # 指向 Java 后端
    depends_on:
      - backend

  # --- Java 后端服务 ---
  backend:
    build: ./backend-java
    container_name: backend_java
    ports:
      - "8080:8080"
    # 如果 Java 需要调用 Python，确保它知道 ai-service 这个主机名
    depends_on:
      - ai-service

  # --- Python AI 服务 ---
  ai-service:
    build: ./ai-service-python
    container_name: ai_service_python
    ports:
      - "8000:8000"
    env_file:
      - .env  # 加载根目录的 .env 文件
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      #- OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - grobid

  # --- GROBID 服务（用于PDF解析） ---
  grobid:
    image: lfoppiano/grobid:0.7.2
    container_name: grobid_service
    ports:
      - "8070:8070"
    volumes:
      - grobid_data:/opt/grobid/home

volumes:
  grobid_data: