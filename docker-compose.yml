services:
  # --- 前端 React 服务 ---
  frontend:
    build: ./frontend
    container_name: paper_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app         # 核心：将本地代码映射进容器，实现热更新
      - /app/node_modules       # 防止本地 node_modules 覆盖容器内的
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api # 指向 Java 后端
    depends_on:
      - backend

  # --- Java 后端服务 ---
  backend:
    build: ./backend-java
    container_name: backend_java
    ports:
      - "8080:8080"
    volumes:
      - java_data:/app/data # 🔥 修复：挂载 H2 数据库目录防止数据丢失
    # 如果 Java 需要调用 Python，确保它知道 ai-service 这个主机名
    environment:
      # 🚀 这里告诉 Java：去请求名为 ai-service 的容器
      - SPRING_PROFILES_ACTIVE=dev
      - PYTHON_URL=http://ai-service:8000/api
    depends_on:
      - ai-service

  # --- Python AI 服务 ---
  ai-service:
    build: ./ai-service-python
    container_name: ai_service_python
    restart: always  # 🔥 重要：挂了自动重启，直到 Grobid 准备好
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service-python:/app      # 🔥 修复：映射代码本身，彻底激活 uvicorn --reload
      - chroma_data:/app/chroma_data  # 🔥 修复：挂载向量数据库防止重启后 RAG 失忆
      - huggingface_cache:/root/.cache/huggingface # 挂载 HF 缓存防止每次重启重新下载 1.3GB 模型
    env_file:
      - .env  # 加载根目录的 .env 文件
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - PYTHON_SERVICE_URL=http://ai-service:8000/api
      #- OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - grobid

  # --- GROBID 服务（用于PDF解析） ---
  grobid:
    image: lfoppiano/grobid:0.7.2
    container_name: grobid_service
    ports:
      - "8070:8070"
    environment:
      - JAVA_OPTS=-Xmx4g -Xms2g # 🔥 增加内存，防止频繁 GC 导致卡顿
    volumes:
      - grobid_data:/opt/grobid/home
    deploy:
      resources:
        limits:
          memory: 4G # 建议至少 4G

volumes:
  grobid_data:
  java_data:
  chroma_data:
  huggingface_cache: