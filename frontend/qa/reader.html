<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PDF阅读边界核验</title></head>
<body style="margin:0;padding:12px;background:#f8f8fa">
<p style="font:13px/1.6 sans-serif;margin:0 0 8px">阅读边界核验：只加载本地测试PDF，不调用模型、不上传或保存。</p>
<div id="root" style="height:calc(100dvh - 64px)"></div>
<script type="module">
  import React,{useEffect,useMemo,useState} from 'react';
  import {createRoot} from 'react-dom/client';
  import '/src/index.css';
  import PdfViewer from '/src/components/PdfViewer.tsx';
  const encoder=new TextEncoder();
  const stream='0.85 0.88 0.92 rg 72 560 468 120 re f 72 340 468 120 re f';
  const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << >> /Contents 4 0 R >>',
    `<< /Length ${encoder.encode(stream).length} >>\nstream\n${stream}\nendstream`];
  let pdf='%PDF-1.4\n';const offsets=[];
  objects.forEach((object,index)=>{offsets.push(encoder.encode(pdf).length);pdf+=`${index+1} 0 obj\n${object}\nendobj\n`;});
  const xref=encoder.encode(pdf).length;
  pdf+=`xref\n0 5\n0000000000 65535 f \n${offsets.map(offset=>String(offset).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  function FixtureReader(){
    const [kind,setKind]=useState('broken');
    const url=useMemo(()=>URL.createObjectURL(new Blob([kind==='broken'?'%PDF-1.4\ninvalid test fixture':pdf],{type:'application/pdf'})),[kind]);
    useEffect(()=>()=>URL.revokeObjectURL(url),[url]);
    return React.createElement('div',{style:{display:'flex',flexDirection:'column',height:'100%'}},
      React.createElement('nav',{'aria-label':'测试文件',style:{display:'flex',gap:12,marginBottom:8}},
        ...[['broken','损坏PDF'],['empty','无文字页']].map(([value,label])=>React.createElement('button',{key:value,onClick:()=>setKind(value),'aria-pressed':kind===value},label))),
      React.createElement('div',{style:{flex:1,minHeight:0,border:'1px solid #ddd'}},React.createElement(PdfViewer,{key:kind,fileUrl:url,pdfId:'qa-reader-'+kind})));
  }
  createRoot(document.getElementById('root')).render(React.createElement(FixtureReader));
</script></body></html>
