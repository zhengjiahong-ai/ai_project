# Ruff configuration for Pixiu AI service
target-version = "py311"

[lint]
# Pre-existing issues tracked for incremental resolution.
# UP/BLE/I/SIM/PIE/TRY/PL/ASYNC rules newly enabled by ruff >=0.16.
ignore = [
  "BLE001",   # blind-except (194 instances)
  "S110",     # try-except-pass (32 instances)
  "SIM118",   # in-dict-keys (14 instances)
  "SIM103",   # needless-bool
  "SIM102",   # collapsible-if
  "B005",     # strip-with-multi-characters
  "RUF046",   # unnecessary-cast-to-int
  "PLW1510",  # subprocess-run-without-check
  "RUF059",   # unused-unpacked-variable
  "B008",     # function-call-in-default-argument
  "B023",     # function-uses-loop-variable
  "C401",     # unnecessary-generator-set
  "PIE810",   # multiple-starts-ends-with
  "S112",     # try-except-continue
  "TRY004",   # type-check-without-type-error
  "ASYNC230", # blocking-open-call-in-async-function
  "FURB192",  # sorted-min-max
  "ASYNC210", # blocking-http-call-in-async-function
  "PLW0602",  # global-variable-not-assigned
  "SIM113",   # enumerate-for-loop
  "SIM115",   # open-file-with-context-handler
  "TRY002",   # raise-vanilla-class
  "UP028",    # yield-in-for-loop
]

[lint.per-file-ignores]
# ── Fixed in 11-1 (ruff F821 豁免清零) ──────────────────────────────────────

# ── Intentional E402 (logger before service imports) ─────────────────────────
"services/agent_orchestrator.py" = ["E402"]
"services/analysis_service.py" = ["E402"]
"services/page_translation_service.py" = ["E402"]
"services/query_service.py" = ["E402", "F841"]
"services/research_planner.py" = ["E402"]
"services/retrieval_judge_service.py" = ["E402"]

# ── Known unused variables (readability / future use) ────────────────────────
"services/adversarial_reviewer.py" = ["F841"]
"services/agent_project_service.py" = ["F841"]
"services/background_knowledge_service.py" = ["F841"]
"services/research_session.py" = ["F841"]

# ── Ambiguous variable name ──────────────────────────────────────────────────
"services/cross_lingual.py" = ["E741"]
