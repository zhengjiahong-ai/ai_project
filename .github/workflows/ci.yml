name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
        continue-on-error: true  # model files still have pre-existing TS errors; TSX components pass cleanly

  # ── Frontend E2E ───────────────────────────────────────────────────────────
  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: true
      - run: npm test

  # ── Python AI Service ─────────────────────────────────────────────────────
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service-python/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check services/ routes/ core/
        continue-on-error: true  # informational only for now
      - run: PYTHONPATH=. python -m pytest tests/ -x --timeout=60 --ignore=tests/test_code_execution_api.py
        continue-on-error: true  # some tests need Docker / external services

  # ── Java Backend ──────────────────────────────────────────────────────────
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - run: mvn -B verify -DskipTests
      - run: mvn -B test
        continue-on-error: true  # informational only until test coverage improves
